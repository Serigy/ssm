# Local cluster topology.
#
# One control plane plus two workers, so that podAntiAffinity in the chart
# actually has somewhere to spread replicas — a single-node cluster would let a
# scheduling rule pass locally and fail in staging.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: ssm

nodes:
  - role: control-plane
    kubeadmConfigPatches:
      # Marks this node as eligible for the ingress-nginx controller, which
      # selects on it.
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      # Publishes the ingress on the host so http://ssm.localhost works without
      # port-forwarding or a LoadBalancer.
      - containerPort: 80
        hostPort: 80
        protocol: TCP
      - containerPort: 443
        hostPort: 443
        protocol: TCP

  - role: worker
  - role: worker

networking:
  # Off the common 10.96/172.17 ranges to avoid colliding with a corporate VPN.
  apiServerAddress: "127.0.0.1"
  podSubnet: "10.244.0.0/16"
  serviceSubnet: "10.96.0.0/16"
