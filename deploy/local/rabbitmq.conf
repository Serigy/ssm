# Loaded from /etc/rabbitmq/conf.d/. The definitions file beside it carries the
# ssm user with a salted password hash, generated from secrets/local/ by
# scripts/gen-secrets.sh — the password itself never appears in this config.
load_definitions = /etc/rabbitmq/definitions.json

# The default guest user is local-only by default, but removing it entirely
# means one less account to think about.
loopback_users.guest = false

# A laptop running the whole stack should not lose the broker to a memory alarm.
vm_memory_high_watermark.relative = 0.6
