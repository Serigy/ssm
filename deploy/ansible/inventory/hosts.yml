---
# Committed skeleton. Real inventories go in inventory/*.local.yml, which is
# gitignored — hostnames and users are reconnaissance material.
all:
  children:
    ssm_hosts:
      hosts:
        ssm-app-01:
          ansible_host: 10.0.1.10
        ssm-app-02:
          ansible_host: 10.0.1.11
      vars:
        ansible_user: deploy
        ansible_ssh_private_key_file: ~/.ssh/serigy_deploy
        # Never a password. Key-based only — see roles/common/tasks/main.yml.
        ansible_become_method: sudo
