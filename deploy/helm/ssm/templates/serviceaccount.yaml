{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "ssm.serviceAccountName" . }}
  labels: {{- include "ssm.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
# None of these workloads talk to the Kubernetes API, so the token is dead
# weight and one more credential to steal.
automountServiceAccountToken: false
{{- end }}
