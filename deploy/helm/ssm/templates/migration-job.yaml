{{- $root := . }}
{{- range $name, $svc := .Values.services }}
{{- if and $svc.database (ne ($svc.engine | default "postgres") "mongodb") }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $name }}-migrate-{{ $root.Release.Revision }}
  labels:
    {{- include "ssm.labels" $root | nindent 4 }}
    app.kubernetes.io/component: {{ $name }}-migrate
  annotations:
    # Runs before the Deployments are updated, so the schema is always at least
    # as new as the code that will run against it.
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  backoffLimit: 3
  # Migrations are the one place a hang must not block a deploy indefinitely.
  activeDeadlineSeconds: 600
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        {{- include "ssm.labels" $root | nindent 8 }}
        app.kubernetes.io/component: {{ $name }}-migrate
    spec:
      restartPolicy: Never
      serviceAccountName: {{ include "ssm.serviceAccountName" $root }}
      automountServiceAccountToken: false
      securityContext: {{- include "ssm.podSecurityContext" $root | nindent 8 }}
      containers:
        - name: migrate
          image: "{{ $root.Values.image.registry }}/{{ $name }}:{{ $root.Values.image.tag }}"
          imagePullPolicy: {{ $root.Values.image.pullPolicy }}
          securityContext: {{- include "ssm.containerSecurityContext" $root | nindent 12 }}
          command:
            - node
            - node_modules/typeorm/cli.js
            - migration:run
            - -d
            - dist/data-source.js
          env:
            {{- include "ssm.commonEnv" (dict "root" $root "svc" $svc) | nindent 12 }}
          volumeMounts:
            - name: secrets
              mountPath: /run/secrets
              readOnly: true
            - name: tmp
              mountPath: /tmp
          resources:
            requests: { cpu: 100m, memory: 192Mi }
            limits:   { cpu: 500m, memory: 512Mi }
      volumes:
        - name: secrets
          secret:
            secretName: {{ $root.Values.secretName }}
            defaultMode: 0400
        - name: tmp
          emptyDir: { sizeLimit: 32Mi }
{{- end }}
{{- end }}
