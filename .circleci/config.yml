# Runs after the merge: verifies the protected branches and deploys two of them.
# The gate before the merge is .github/workflows/mr-check.yml.
#
#   development -> verify only; it has no remote environment
#   staging     -> verify, deploy to hmg
#   main        -> verify, wait for approval, deploy to prd
version: 2.1

executors:
  node:
    docker:
      # Keep the major in step with .nvmrc.
      - image: cimg/node:22.22
    resource_class: medium
    environment:
      NX_NO_CLOUD: 'true'

commands:
  setup:
    steps:
      - checkout

      - run:
          name: Instalar o pnpm da versão fixada em package.json
          command: |
            sudo npm install --global "$(node -p "require('./package.json').packageManager")"

      - restore_cache:
          keys:
            - pnpm-v1-{{ checksum "pnpm-lock.yaml" }}

      - run:
          name: Instalar dependências
          command: |
            pnpm config set store-dir ~/.pnpm-store
            pnpm install --frozen-lockfile

      - save_cache:
          key: pnpm-v1-{{ checksum "pnpm-lock.yaml" }}
          paths:
            - ~/.pnpm-store

jobs:
  check:
    executor: node
    steps:
      - setup

      - run:
          name: Gerar segredos de teste
          # The build imports code that reads the JWT public key at module init.
          command: |
            echo "export SSM_SECRETS_DIR=\"$PWD/secrets/local\"" >> "$BASH_ENV"
            ./scripts/gen-secrets.sh

      - run:
          name: Lint, tipos, testes e build
          # Two workers, one per vCPU of the medium resource class.
          command: pnpm nx run-many -t lint,typecheck,test,build --parallel=2

  deploy:
    executor: node
    parameters:
      environment:
        type: enum
        enum: [hmg, prd]
    steps:
      - setup

      - run:
          name: Instalar o sentry-cli
          command: sudo npm install --global @sentry/cli@3.8.2

      - run:
          name: Implantar em << parameters.environment >>
          command: ./scripts/cf-deploy.sh << parameters.environment >>

workflows:
  entrega:
    jobs:
      - check:
          filters:
            branches:
              only: [development, staging, main]

      - deploy:
          name: deploy-hmg
          environment: hmg
          context: ssm-hmg
          requires: [check]
          filters:
            branches:
              only: staging

      - aprovar-prd:
          type: approval
          requires: [check]
          filters:
            branches:
              only: main

      - deploy:
          name: deploy-prd
          environment: prd
          context: ssm-prd
          requires: [aprovar-prd]
          filters:
            branches:
              only: main
