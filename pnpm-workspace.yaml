packages:
  - 'apps/*'
  - 'libs/*'
  - 'tools/*'

# pnpm blocks postinstall scripts by default — a malicious package's install
# script is one of the cheapest supply-chain attacks there is. Each entry below
# is an explicit decision; anything not listed stays blocked.
allowBuilds:
  argon2: true               # native Argon2id binding — password hashing needs it
  esbuild: true              # fetches its platform binary
  nx: true                   # native task-runner binaries
  '@aikidosec/firewall': true # native instrumentation hooks
  '@scarf/scarf': false      # analytics telemetry only — no reason to run it

# Settings live here rather than in .npmrc: pnpm 11 reads them from the
# workspace manifest, and npm emits "Unknown project config" warnings on every
# command when pnpm-only keys sit in .npmrc.
dangerouslyAllowAllBuilds: false
autoInstallPeers: true
strictPeerDependencies: false
