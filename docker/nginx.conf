pid /tmp/nginx.pid;

server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Temp paths under /tmp so the container filesystem can stay read-only.
  client_body_temp_path /tmp/client_body;
  proxy_temp_path       /tmp/proxy;
  fastcgi_temp_path     /tmp/fastcgi;
  uwsgi_temp_path       /tmp/uwsgi;
  scgi_temp_path        /tmp/scgi;

  access_log /dev/stdout;
  error_log  /dev/stderr warn;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy no-referrer always;

  location = /healthz {
    access_log off;
    return 200 "ok\n";
  }

  # remoteEntry.js is the federation manifest. It MUST NOT be cached: a stale
  # copy points the shell at chunk hashes that no longer exist, which is the
  # classic micro-frontend outage after a deploy.
  location = /remoteEntry.js {
    add_header Cache-Control "no-store, must-revalidate" always;
    # The shell fetches it from a different origin in development.
    add_header Access-Control-Allow-Origin "*" always;
    try_files $uri =404;
  }

  # Content-hashed assets are immutable by construction.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header Access-Control-Allow-Origin "*" always;
    try_files $uri =404;
  }

  # SPA fallback: the router owns every other path.
  location / {
    add_header Cache-Control "no-cache" always;
    try_files $uri $uri/ /index.html;
  }
}
